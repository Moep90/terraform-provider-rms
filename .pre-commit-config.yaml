repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|tf)$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: \.pem$
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go specific hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v1.0.0
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-imports
        args: [-local, github.com/teltonika-rms/terraform-provider-teltonika-rms]
      - id: go-mod-tidy
      - id: go-mod-verify
      - id: go-build
        args: [-o, /dev/null, ./cmd/terraform-provider-teltonika-rms]
      - id: go-test
        args: [-v, -race, -cover, ./...]
      - id: go-vet-all
      - id: go-fmt-all

  # Go linting
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.59.1
    hooks:
      - id: golangci-lint
        args: [--timeout=5m]

  # Terraform specific hooks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --init-args=-backend=false
      - id: terraform_docs
        args:
          - --args=--lockfile=false
      - id: terraform_tflint
        args:
          - --hook-config=--path-to-binary=tflint
          - --hook-config=--add-to-flag=--config=/.tflint.hcl

  # Security scanning
  - repo: https://github.com/securego/gosec
    rev: v2.20.0
    hooks:
      - id: gosec
        args: [-exclude=G104,G107,G204]

  # Documentation
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.19.0
    hooks:
      - id: gitleaks

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, '{extends: relaxed, rules: {line-length: {max: 120}}}']

  # Shell scripts (if any)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Check for common issues
  - repo: local
    hooks:
      - id: check-go-version
        name: Check Go version consistency
        entry: bash -c 'go version && grep "^go " go.mod'
        language: system
        pass_filenames: false
        files: ^go\.mod$
